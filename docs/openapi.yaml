openapi: 3.1.0
info:
  title: PrivacyVault API
  version: v1
  description: GDPR-oriented encrypted personal-data API. Runtime documentation is available at /v3/api-docs.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
paths:
  /api/v1/auth/register:
    post:
      security: []
      summary: Register a user and issue tokens
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Credentials'}
      responses:
        '201': {$ref: '#/components/responses/Tokens'}
        '400': {$ref: '#/components/responses/Problem'}
  /api/v1/auth/login:
    post:
      security: []
      summary: Authenticate
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Credentials'}
      responses:
        '200': {$ref: '#/components/responses/Tokens'}
        '401': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
  /api/v1/auth/refresh:
    post:
      security: []
      summary: Rotate refresh token; reuse revokes the token family
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties: {refreshToken: {type: string}}
      responses:
        '200': {$ref: '#/components/responses/Tokens'}
        '401': {$ref: '#/components/responses/Problem'}
  /api/v1/auth/logout:
    post:
      security: []
      summary: Revoke the supplied refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties: {refreshToken: {type: string}}
      responses:
        '200': {description: Token revoked}
  /api/v1/auth/logout-all:
    post:
      summary: Revoke all refresh tokens and invalidate access JWTs
      responses:
        '200': {description: Sessions revoked}
        '401': {$ref: '#/components/responses/Problem'}
  /api/v1/users/me/data:
    get:
      summary: Access personal data (Article 15)
      responses:
        '200':
          description: Decrypted data belonging to the authenticated user
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserData'}
        '401': {$ref: '#/components/responses/Problem'}
  /api/v1/users/me/export:
    get:
      summary: Export JSON data (Article 20)
      responses:
        '200':
          description: Machine-readable export
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserData'}
  /api/v1/users/me:
    patch:
      summary: Rectify profile data (Article 16)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProfilePatch'}
      responses:
        '200': {description: Profile updated}
        '400': {$ref: '#/components/responses/Problem'}
    delete:
      summary: Request erasure (Article 17); requires password confirmation
      parameters:
        - name: immediate
          in: query
          required: false
          schema: {type: boolean, default: false}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties: {password: {type: string, format: password}}
      responses:
        '200':
          description: Erasure state; scheduled requests return a one-time cancellation token
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, enum: [PENDING, COMPLETED]}
                  scheduledFor: {type: string, format: date-time}
                  cancellationToken: {type: string}
  /api/v1/users/me/erasure/cancel:
    post:
      security: []
      summary: Cancel pending erasure with the one-time cancellation token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cancellationToken]
              properties: {cancellationToken: {type: string}}
      responses:
        '204': {description: Erasure cancelled}
        '404': {$ref: '#/components/responses/Problem'}
  /api/v1/users/me/consents:
    get:
      summary: Read consent history
      responses:
        '200':
          description: Append-only consent events
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/ConsentEvent'}
    post:
      summary: Record grant or withdrawal (Article 7)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConsentInput'}
      responses:
        '200': {description: Consent event appended}
  /api/v1/users/me/restriction:
    patch:
      summary: Restrict or resume processing (Article 18)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [restricted]
              properties: {restricted: {type: boolean}}
      responses:
        '200': {description: Restriction state updated}
  /api/v1/admin/audit:
    get:
      summary: Admin-only paged audit metadata; contains no decrypted user fields
      parameters:
        - {name: page, in: query, schema: {type: integer, minimum: 0, default: 0}}
        - {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      responses:
        '200': {description: Audit page}
        '403': {$ref: '#/components/responses/Problem'}
  /api/v1/admin/keys/rotate:
    post:
      summary: Admin-only KMS DEK re-wrapping
      responses:
        '200': {description: Number of keys rotated}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Credentials:
      type: object
      required: [email, password]
      properties:
        email: {type: string, format: email, maxLength: 254}
        password: {type: string, format: password, minLength: 12, maxLength: 128}
    UserData:
      type: object
      properties:
        email: {type: string}
        firstName: {type: string}
        lastName: {type: string}
        phone: {type: string}
        address: {type: string}
        dateOfBirth: {type: string, format: date}
        status: {type: string}
        processingPurposes: {type: array, items: {type: string}}
        consentHistory:
          type: array
          items: {$ref: '#/components/schemas/ConsentEvent'}
        retentionInformation: {type: string}
        accountCreatedAt: {type: string, format: date-time}
    ProfilePatch:
      type: object
      properties:
        firstName: {type: string, maxLength: 100}
        lastName: {type: string, maxLength: 100}
        phone: {type: string, maxLength: 30}
        address: {type: string, maxLength: 500}
        dateOfBirth: {type: string, format: date}
    ConsentInput:
      type: object
      required: [purpose, policyVersion, action]
      properties:
        purpose: {type: string, maxLength: 100}
        policyVersion: {type: string, maxLength: 64}
        action: {type: string, enum: [GRANTED, WITHDRAWN]}
    ConsentEvent:
      allOf:
        - {$ref: '#/components/schemas/ConsentInput'}
        - type: object
          properties: {recordedAt: {type: string, format: date-time}}
    Problem:
      type: object
      properties:
        type: {type: string, format: uri}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        instance: {type: string, format: uri}
        requestId: {type: string}
  responses:
    Tokens:
      description: Access and refresh token pair
      content:
        application/json:
          schema:
            type: object
            properties:
              accessToken: {type: string}
              refreshToken: {type: string}
              accessExpiresAt: {type: string, format: date-time}
              refreshExpiresAt: {type: string, format: date-time}
    Problem:
      description: RFC 7807 problem response
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
