services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - source: db_password
        target: postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-1g}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: privacyvault-api:${APP_IMAGE_TAG:?Set APP_IMAGE_TAG to a release identifier}
    restart: unless-stopped
    init: true
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_CONFIG_IMPORT: configtree:/run/secrets/
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER:?Set POSTGRES_USER}
      SERVER_PORT: 8080
      PRIVACYVAULT_CRYPTO_KEY_PROVIDER: aws-kms
      AWS_REGION: ${AWS_REGION:?Set AWS_REGION}
      AWS_KMS_ROTATION_EPOCH: ${AWS_KMS_ROTATION_EPOCH:-v1}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set explicit HTTPS CORS origins}
      JWT_ISSUER: ${JWT_ISSUER:-privacy-vault}
      ERASURE_GRACE_DAYS: ${ERASURE_GRACE_DAYS:-14}
      SWAGGER_ENABLED: "false"
    secrets:
      - source: db_password
        target: spring.datasource.password
      - source: blind_index_key
        target: privacyvault.crypto.blind-index-key
      - source: pseudonym_key
        target: privacyvault.crypto.pseudonym-key
      - source: jwt_secret
        target: privacyvault.jwt.secret
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_BIND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: ${API_MEMORY_LIMIT:-1g}
    cpus: ${API_CPU_LIMIT:-2}
    networks:
      - data
      - egress
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

networks:
  data:
    internal: true
  egress:

volumes:
  postgres-data:

secrets:
  db_password:
    file: ${SECRET_DIR:?Set SECRET_DIR}/postgres_password
  blind_index_key:
    file: ${SECRET_DIR:?Set SECRET_DIR}/blind_index_key
  pseudonym_key:
    file: ${SECRET_DIR:?Set SECRET_DIR}/pseudonym_key
  jwt_secret:
    file: ${SECRET_DIR:?Set SECRET_DIR}/jwt_secret
