services:
  postgres:
    image: postgres:16.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-privacyvault}
      POSTGRES_USER: ${POSTGRES_USER:-privacyvault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-privacyvault} -d ${POSTGRES_DB:-privacyvault}"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true

  api:
    build: .
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-privacyvault}
      DB_USERNAME: ${POSTGRES_USER:-privacyvault}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PRIVACYVAULT_MASTER_KEY: ${PRIVACYVAULT_MASTER_KEY:-}
      PRIVACYVAULT_BLIND_INDEX_KEY: ${PRIVACYVAULT_BLIND_INDEX_KEY:?Set PRIVACYVAULT_BLIND_INDEX_KEY in .env}
      PRIVACYVAULT_PSEUDONYM_KEY: ${PRIVACYVAULT_PSEUDONYM_KEY:?Set PRIVACYVAULT_PSEUDONYM_KEY in .env}
      PRIVACYVAULT_JWT_SECRET: ${PRIVACYVAULT_JWT_SECRET:?Set PRIVACYVAULT_JWT_SECRET in .env}
      KEY_PROVIDER: ${KEY_PROVIDER:-env}
      AWS_REGION: ${AWS_REGION:-eu-central-1}
      AWS_KMS_ROTATION_EPOCH: ${AWS_KMS_ROTATION_EPOCH:-v1}
      JWT_ISSUER: ${JWT_ISSUER:-privacy-vault}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      ERASURE_GRACE_DAYS: ${ERASURE_GRACE_DAYS:-14}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      SERVER_PORT: 8080
    ports:
      - "${SERVER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data:
