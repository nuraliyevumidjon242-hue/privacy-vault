name: CI

on:
  push:
    pull_request:

    permissions:
      contents: read

      jobs:
        build-test-scan:
            runs-on: ubuntu-latest
                steps:
                      - uses: actions/checkout@v4
                            - uses: actions/setup-java@v4
                                    with:
                                              distribution: temurin
                                                        java-version: '25'
                                                                  cache: maven
                                                                        - name: Build and test
                                                                                run: mvn -B verify
                                                                                      - name: Build container image
                                                                                              run: docker build --tag privacyvault-api:ci .
                                                                                                    - name: Skip Dependency-Check for fork pull requests
                                                                                                            if: github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.actor == 'dependabot[bot]')
                                                                                                                    run: echo "::notice::Fork and Dependabot pull requests do not receive NVD_API_KEY; Dependency-Check runs on trusted events."
                                                                                                                          - name: Require NVD API key
                                                                                                                                  if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && github.actor != 'dependabot[bot]'
                                                                                                                                          env:
                                                                                                                                                    NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
                                                                                                                                                            run: |
                                                                                                                                                                      if [ -z "$NVD_API_KEY" ]; then
                                                                                                                                                                                  echo "::error::Configure the repository NVD_API_KEY secret to run Dependency-Check."
                                                                                                                                                                                              exit 1
                                                                                                                                                                                                        fi
                                                                                                                                                                                                              - name: OWASP Dependency-Check
                                                                                                                                                                                                                      if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && github.actor != 'dependabot[bot]'
                                                                                                                                                                                                                              env:
                                                                                                                                                                                                                                        NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
                                                                                                                                                                                                                                                run: mvn -B org.owasp:dependency-check-maven:check -DnvdApiKey="${NVD_API_KEY}" -DfailBuildOnCVSS=7 -DossIndexAnalyzerEnabled=false
                                                                                                                                                                                                                                                
